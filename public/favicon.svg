<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cyberBg" cx="50%" cy="35%" r="80%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="45%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>

    <!-- Hexagon Border Gradient -->
    <linearGradient id="neonBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="35%" stop-color="#00D9F5" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Primary Neon Emerald to Cyan Gradient -->
    <linearGradient id="neonBeam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Secondary Neon Cyan to Violet Gradient -->
    <linearGradient id="neonBeam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Inner Shield Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#00D9F5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Core Neon Glow Filter -->
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blurWide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blurTight" />
      <feMerge>
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#cyberBg)" stroke="url(#neonBorderGrad)" stroke-width="6" />

  <!-- Ambient Glow in Center -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Cyber Geometric Grid Matrix -->
  <g opacity="0.08" stroke="#00F5A0" stroke-width="1.5">
    <line x1="20" y1="128" x2="492" y2="128" />
    <line x1="20" y1="256" x2="492" y2="256" />
    <line x1="20" y1="384" x2="492" y2="384" />
    <line x1="128" y1="20" x2="128" y2="492" />
    <line x1="256" y1="20" x2="256" y2="492" />
    <line x1="384" y1="20" x2="384" y2="492" />
  </g>

  <!-- Futuristic Corner Bracket Accents -->
  <g stroke="url(#neonBorderGrad)" stroke-width="4" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M 68 110 L 68 68 L 110 68" />
    <path d="M 444 110 L 444 68 L 402 68" />
    <path d="M 68 402 L 68 444 L 110 444" />
    <path d="M 444 402 L 444 444 L 402 444" />
  </g>

  <!-- Top Terminal Window Controls -->
  <g transform="translate(180, 56)">
    <circle cx="20" cy="14" r="6" fill="#EF4444" opacity="0.9" />
    <circle cx="48" cy="14" r="6" fill="#F59E0B" opacity="0.9" />
    <circle cx="76" cy="14" r="6" fill="#00F5A0" opacity="0.9" />
    <circle cx="104" cy="14" r="6" fill="#00D9F5" opacity="0.9" />
    <circle cx="132" cy="14" r="6" fill="#8B5CF6" opacity="0.9" />
  </g>

  <!-- Outer Hexagonal Cyber Ring -->
  <polygon points="256,92 384,166 384,314 256,388 128,314 128,166" 
           fill="none" 
           stroke="url(#neonBorderGrad)" 
           stroke-width="3" 
           opacity="0.35" 
           stroke-dasharray="14 10" />

  <!-- MAIN "X" TERMINAL GLYPH -->
  <g filter="url(#hyperGlow)">
    <!-- Primary Forward Terminal Prompt Chevron ( > ) -->
    <path d="M 124 148 L 244 256 L 124 364" 
          fill="none" 
          stroke="url(#neonBeam1)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Opposing Reverse Prompt Chevron forming the "X" ( < ) -->
    <path d="M 388 148 L 268 256 L 388 364" 
          fill="none" 
          stroke="url(#neonBeam2)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Core Nexus Interlock Diamond in Center of the "X" -->
    <polygon points="256,226 286,256 256,286 226,256" fill="#FFFFFF" opacity="0.95" />

    <!-- Blinking Command Line Prompt Underscore ( _ ) -->
    <line x1="200" y1="416" x2="312" y2="416" 
          stroke="#00F5A0" 
          stroke-width="26" 
          stroke-linecap="round" 
          filter="url(#softGlow)" />
  </g>

  <!-- Status Neon Pulse Orb -->
  <circle cx="420" cy="92" r="7" fill="#00F5A0" filter="url(#softGlow)" />
  <circle cx="420" cy="92" r="3" fill="#FFFFFF" />
</svg>
