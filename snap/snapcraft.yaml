name: xterminal
base: core22
adopt-info: xterminal
summary: Next-Gen SSH, Telnet, Serial & DevOps Terminal Workstation
description: |
  xTerminal is a modern, high-performance terminal workstation engineered for
  DevOps professionals, cloud architects, sysadmins, and network engineers.
  Features full-duplex SSH, Telnet, Serial console, parallel multi-host command
  runner, real-time server telemetry, and built-in SFTP file transfers.

grade: stable
confinement: strict

architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [arm64]
    build-for: [arm64]

apps:
  xterminal:
    command: xterminal --no-sandbox
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - removable-media

parts:
  xterminal:
    plugin: nil
    source: .
    build-snaps:
      - node/22/stable
    override-pull: |
      craftctl default
      # Auto-detect version directly from package.json or git tag
      VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n 1)
      craftctl set version="${VERSION:-1.2.6}"
    override-build: |
      export PATH="/snap/bin:$PATH"
      echo "Using Node version: $(node -v)"
      echo "Using NPM version: $(npm -v)"
      npm install --legacy-peer-deps
      npm run build
      npx electron-builder --linux --dir
      cp -r release/linux-unpacked/* $CRAFT_PART_INSTALL/
    build-packages:
      - git
    stage-packages:
      - libnss3
      - libatk1.0-0
      - libasound2
      - libdrm2
      - libgbm1
