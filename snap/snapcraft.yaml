name: xterminal
base: core22
adopt-info: xterminal
summary: Next-Gen SSH, Telnet, Serial & DevOps Terminal Workstation
description: |
  xTerminal is a modern, high-performance terminal workstation engineered for
  DevOps professionals, cloud architects, sysadmins, and network engineers.
  Features full-duplex SSH, Telnet, Serial console, parallel multi-host command
  runner, real-time server telemetry, and built-in SFTP file transfers.

grade: stable
confinement: strict

apps:
  xterminal:
    command: xterminal --no-sandbox
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - removable-media

parts:
  xterminal:
    plugin: nil
    source: .
    override-pull: |
      craftctl default
      # Auto-detect version directly from package.json or git tag on GitHub
      VERSION=$(node -p "require('./package.json').version" 2>/dev/null || git describe --tags --always | sed 's/^v//')
      craftctl set version="$VERSION"
    override-build: |
      npm ci
      npm run build
      npx electron-builder --linux --dir
      cp -r release/linux-unpacked/* $CRAFT_PART_INSTALL/
    build-packages:
      - nodejs
      - npm
      - git
    stage-packages:
      - libnss3
      - libatk1.0-0
      - libasound2
      - libdrm2
      - libgbm1
